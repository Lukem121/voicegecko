name: "Setup and install"
description: "Common setup steps for Actions"

inputs:
  enable-cache:
    description: "Enable pnpm cache via setup-node (use false on persistent self-hosted runners)"
    required: false
    default: "true"
  install-turbo:
    description: "Install turbo globally"
    required: false
    default: "true"
  install-dependencies:
    description: "Run pnpm install"
    required: false
    default: "true"
  pnpm-args:
    description: "Arguments passed to pnpm install"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - name: Setup Node.js (with cache)
      if: inputs.enable-cache == 'true'
      uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: pnpm

    - name: Setup Node.js (no cache)
      if: inputs.enable-cache != 'true'
      uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"

    - name: Install turbo
      if: inputs.install-turbo == 'true'
      shell: bash
      run: pnpm add -g turbo

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install ${{ inputs.pnpm-args }}
