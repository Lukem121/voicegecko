[package]
name = "desktop"
version = "0.0.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "app_lib"

[build-dependencies]
tauri-build = {version = "2.3.1", features = [] }
reqwest = { version = "0.12", features = ["blocking"] }
sha1 = "0.10"

[dependencies]
async-trait = "0.1"
serde = {version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.7.0", features = ["tray-icon", "devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2.5.0"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2.3.0"
tauri-plugin-store = "2.3.0"
tauri-plugin-process = "2"
url = "2.4"
cpal = "0.15.3"
rodio = { version = "0.18.1", features = ["mp3"] }
hound = "3.5.1"
crossbeam-channel = "0.5.13"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.46.1", features = ["full"] }
futures-util = "0.3.31"
sha1 = "0.10"
thiserror = "2.0.12"
rubato = "0.15.0"
tauri-plugin-log = "2.6.0"
tauri-plugin-clipboard-manager = "2"
rustfft = "6.1"
num-complex = "0.4"
nnnoiseless = "0.5"
sysinfo = "0.32"

# Conditional whisper-rs features based on target OS
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14.3", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.14.3", features = ["vulkan"] }


[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"

[target."cfg(target_os = \"windows\")".dependencies]
windows = { version = "0.58", features = [
  "Win32_UI_WindowsAndMessaging", 
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com"
] }
