name: "publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: "macos-latest" # for Arm based macs (M1 and above).
          #   args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest" # for Intel based macs.
          #   args: "--target x86_64-apple-darwin"
          # - platform: "ubuntu-22.04"
          #   args: ""
          # - platform: "windows-latest"
          #   args: ""
          - platform: "self-hosted"
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: ${{ matrix.platform == 'self-hosted' && 'powershell' || (contains(matrix.platform, 'windows') && 'powershell' || 'bash') }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS (Self-hosted)
        if: matrix.platform == 'self-hosted'
        shell: powershell
        run: |
          git lfs install --force
          git lfs pull

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: setup Node.js cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/AppData/Local/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
        if: matrix.platform != 'self-hosted'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
        if: matrix.platform != 'self-hosted'

      - name: setup Rust on self-hosted Windows
        if: matrix.platform == 'self-hosted'
        run: |
          # Check if Rust is already installed
          $rustInstalled = Get-Command rustc -ErrorAction SilentlyContinue
          if ($rustInstalled) {
            Write-Host "Rust is already installed at: $($rustInstalled.Path)"
            # Update Rust to ensure we have the latest stable
            rustup update stable
            rustup default stable
          } else {
            Write-Host "Installing Rust..."
            # Download and install rustup
            $rustupUrl = "https://win.rustup.rs/x86_64"
            $rustupInstaller = "$env:TEMP\rustup-init.exe"
            Invoke-WebRequest -Uri $rustupUrl -OutFile $rustupInstaller
            & $rustupInstaller -y --default-toolchain stable --default-host x86_64-pc-windows-msvc
          }

          # Ensure Rust binaries are in GitHub Actions PATH for subsequent steps
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          if (Test-Path $cargoPath) {
            "$cargoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added $cargoPath to GITHUB_PATH"
          }

          # Also set for current session
          $env:PATH = "$cargoPath;$env:PATH"

          # Verify Rust installation
          rustc --version
          cargo --version

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config

      - name: install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          # Set macOS deployment target to 10.15 for C++ filesystem support
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV

          # macOS will use Metal acceleration (configured in Cargo.toml)
          echo "macOS dependencies configured - using Metal acceleration with 10.15+ deployment target"

      - name: install dependencies (windows self-hosted)
        if: matrix.platform == 'self-hosted'
        run: |
          # Check if CMake is installed
          $cmakeInstalled = Get-Command cmake -ErrorAction SilentlyContinue
          if (-not $cmakeInstalled) {
            Write-Host "Installing CMake..."
            # Download and install CMake
            $cmakeUrl = "https://github.com/Kitware/CMake/releases/download/v3.28.1/cmake-3.28.1-windows-x86_64.msi"
            $cmakeInstaller = "$env:TEMP\cmake-installer.msi"
            Invoke-WebRequest -Uri $cmakeUrl -OutFile $cmakeInstaller
            Start-Process msiexec.exe -ArgumentList "/i", $cmakeInstaller, "/quiet", "/norestart" -Wait
            
            # Verify installation and add to PATH
            if (Test-Path "C:\Program Files\CMake\bin\cmake.exe") {
              "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              Write-Error "CMake installation failed"
              exit 1
            }
          } else {
            Write-Host "CMake is already installed"
          }

          # Check if Vulkan SDK is installed and set environment variables
          if (-not (Test-Path "C:\VulkanSDK")) {
            Write-Host "Installing Vulkan SDK..."
            # Download and install Vulkan SDK
            $vulkanUrl = "https://sdk.lunarg.com/sdk/download/1.4.321.1/windows/VulkanSDK-1.4.321.1-Installer.exe"
            $vulkanInstaller = "$env:TEMP\VulkanSDK-Installer.exe"
            Invoke-WebRequest -Uri $vulkanUrl -OutFile $vulkanInstaller
            Start-Process -FilePath $vulkanInstaller -ArgumentList "/S" -Wait
            # Set VULKAN_SDK environment variable persistently for GitHub Actions
            "VULKAN_SDK=C:\VulkanSDK\1.4.321.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "C:\VulkanSDK\1.4.321.1\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "Vulkan SDK is already installed"
            # Find the installed version and set environment variable persistently
            $vulkanVersion = Get-ChildItem "C:\VulkanSDK" | Select-Object -First 1 -ExpandProperty Name
            $vulkanPath = "C:\VulkanSDK\$vulkanVersion"
            "VULKAN_SDK=$vulkanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$vulkanPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Build FULL version (with model bundled) for first-time installations
      - name: Build Full Version (with model)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_PUBLIC_VOICEGECKO_URL: ${{ vars.VITE_PUBLIC_VOICEGECKO_URL }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
          TAURI_BUNDLE_IDENTIFIER_SUFFIX: "-full"
        with:
          tagName: app-v__VERSION__-full # Full version for website downloads
          releaseName: "App v__VERSION__ (Full)"
          releaseBody: "Full installation package with bundled AI model. See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: apps/desktop

      # Temporarily move model file for update build (without model) - Windows
      - name: Prepare Update Build - Windows
        if: matrix.platform == 'self-hosted' || contains(matrix.platform, 'windows')
        shell: powershell
        run: |
          # Move the model file temporarily to exclude it from the build
          $modelPath = "apps/desktop/src-tauri/resources/ggml-base.en.bin"
          $backupPath = "apps/desktop/src-tauri/ggml-base.en.bin.backup"

          if (Test-Path $modelPath) {
            Write-Host "Moving model file for update build..."
            Move-Item $modelPath $backupPath
            Write-Host "Model file moved to backup location"
          } else {
            Write-Host "Model file not found at expected location: $modelPath"
          }

      # Temporarily move model file for update build (without model) - Unix
      - name: Prepare Update Build - Unix
        if: matrix.platform == 'macos-latest' || matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          # Move the model file temporarily to exclude it from the build
          MODEL_PATH="apps/desktop/src-tauri/resources/ggml-base.en.bin"
          BACKUP_PATH="apps/desktop/src-tauri/ggml-base.en.bin.backup"

          if [ -f "$MODEL_PATH" ]; then
            echo "Moving model file for update build..."
            mv "$MODEL_PATH" "$BACKUP_PATH"
            echo "Model file moved to backup location"
          else
            echo "Model file not found at expected location: $MODEL_PATH"
          fi

      # Build UPDATE version (without model) for existing users
      - name: Build Update Version (without model)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_PUBLIC_VOICEGECKO_URL: ${{ vars.VITE_PUBLIC_VOICEGECKO_URL }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
          TAURI_BUNDLE_IDENTIFIER_SUFFIX: "-update"
        with:
          tagName: app-v__VERSION__-update # Update version for updater system
          releaseName: "App v__VERSION__ (Update)"
          releaseBody: "Lightweight update package without bundled AI model. For existing users only."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: apps/desktop

      # Restore model file after build - Windows (always run to ensure cleanup)
      - name: Restore Model File - Windows
        if: always() && (matrix.platform == 'self-hosted' || contains(matrix.platform, 'windows'))
        shell: powershell
        run: |
          # Restore the model file after build
          $modelPath = "apps/desktop/src-tauri/resources/ggml-base.en.bin"
          $backupPath = "apps/desktop/src-tauri/ggml-base.en.bin.backup"

          if (Test-Path $backupPath) {
            Write-Host "Restoring model file..."
            Move-Item $backupPath $modelPath -Force
            Write-Host "Model file restored"
          } else {
            Write-Host "No backup model file found to restore"
          }

      # Restore model file after build - Unix (always run to ensure cleanup)
      - name: Restore Model File - Unix
        if: always() && (matrix.platform == 'macos-latest' || matrix.platform == 'ubuntu-22.04')
        shell: bash
        run: |
          # Restore the model file after build
          MODEL_PATH="apps/desktop/src-tauri/resources/ggml-base.en.bin"
          BACKUP_PATH="apps/desktop/src-tauri/ggml-base.en.bin.backup"

          if [ -f "$BACKUP_PATH" ]; then
            echo "Restoring model file..."
            mv "$BACKUP_PATH" "$MODEL_PATH"
            echo "Model file restored"
          else
            echo "No backup model file found to restore"
          fi

      # Publish to separate public releases repository
      - name: Create Releases in Public Repository (Windows/Self-hosted)
        if: matrix.platform == 'self-hosted' || contains(matrix.platform, 'windows')
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: powershell
        run: |
          # Get the version from the package.json
          $VERSION = (Get-Content "apps/desktop/package.json" | ConvertFrom-Json).version

          # Create FULL release (for website downloads)
          $FULL_TAG = "app-v$VERSION-full"
          try {
            gh release create $FULL_TAG --repo "Lukem121/voicegecko-releases" --title "App v$VERSION (Full)" --notes "Full installation package with bundled AI model. For first-time installations from website." 2>$null
            Write-Host "Created full release: $FULL_TAG"
          } catch {
            Write-Host "Full release $FULL_TAG already exists or creation failed - continuing with upload"
          }

          # Create UPDATE release (for updater system)
          $UPDATE_TAG = "app-v$VERSION-update"
          try {
            gh release create $UPDATE_TAG --repo "Lukem121/voicegecko-releases" --title "App v$VERSION (Update)" --notes "Lightweight update package without bundled AI model. For existing users via updater." 2>$null
            Write-Host "Created update release: $UPDATE_TAG"
          } catch {
            Write-Host "Update release $UPDATE_TAG already exists or creation failed - continuing with upload"
          }

          # Upload artifacts from both builds
          # Check for artifacts in the standard location first
          $BUNDLE_DIR = "target/release/bundle"
          if (-not (Test-Path $BUNDLE_DIR)) {
            Write-Host "Standard bundle directory not found, checking for target-specific directories..."
            # Look for any target-specific bundle directories
            $TARGET_DIRS = Get-ChildItem -Path "target" -Directory | Where-Object { Test-Path "$($_.FullName)/release/bundle" }
            if ($TARGET_DIRS) {
              $BUNDLE_DIR = "$($TARGET_DIRS[0].FullName)/release/bundle"
              Write-Host "Found target-specific bundle directory: $BUNDLE_DIR"
            }
          }

          Write-Host "Looking for artifacts in: $BUNDLE_DIR"
          if (Test-Path $BUNDLE_DIR) {
            $ARTIFACTS = Get-ChildItem -Path $BUNDLE_DIR -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe', '.sig') }
            foreach ($artifact in $ARTIFACTS) {
              $fileName = $artifact.Name
              Write-Host "Processing artifact: $fileName"
              
              # Determine if this is a full or update build based on file size or build context
              # For now, we'll rename and upload to both releases
              # You may need to adjust this logic based on your specific build output
              
              # Upload to full release with "-full" suffix
              $fullName = $fileName -replace '(\.[^.]+)$', '-full$1'
              Write-Host "Uploading $fullName to full release"
              gh release upload $FULL_TAG $artifact.FullName --repo "Lukem121/voicegecko-releases" --clobber
              
              # Upload to update release with "-update" suffix  
              $updateName = $fileName -replace '(\.[^.]+)$', '-update$1'
              Write-Host "Uploading $updateName to update release"
              gh release upload $UPDATE_TAG $artifact.FullName --repo "Lukem121/voicegecko-releases" --clobber
            }
          } else {
            Write-Host "ERROR: No bundle directory found in any target location"
            exit 1
          }

      - name: Revalidate Website Cache (Windows)
        if: matrix.platform == 'self-hosted' || contains(matrix.platform, 'windows')
        shell: powershell
        run: |
          Write-Host "Triggering ISR revalidation for landing page..."
          $body = @{
            secret = "${{ secrets.REVALIDATE_SECRET }}"
            paths = @("/")
            tags = @("downloads", "landing-page")
          } | ConvertTo-Json

          try {
            $response = Invoke-RestMethod -Uri "${{ vars.VITE_PUBLIC_VOICEGECKO_URL }}/api/revalidate" -Method POST -Body $body -ContentType "application/json" -TimeoutSec 30
            Write-Host "Revalidation successful: $($response.message)"
          } catch {
            Write-Host "Revalidation failed - this is non-critical: $($_.Exception.Message)"
          }

      - name: Create Releases in Public Repository (macOS/Linux)
        if: matrix.platform == 'macos-latest' || matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          # Get the version from the package.json
          VERSION=$(node -p "require('./apps/desktop/package.json').version")

          # Create FULL release (for website downloads)
          FULL_TAG="app-v$VERSION-full"
          gh release create $FULL_TAG --repo "Lukem121/voicegecko-releases" --title "App v$VERSION (Full)" --notes "Full installation package with bundled AI model. For first-time installations from website." 2>/dev/null || echo "Full release already exists"

          # Create UPDATE release (for updater system)
          UPDATE_TAG="app-v$VERSION-update"
          gh release create $UPDATE_TAG --repo "Lukem121/voicegecko-releases" --title "App v$VERSION (Update)" --notes "Lightweight update package without bundled AI model. For existing users via updater." 2>/dev/null || echo "Update release already exists"

          # Upload all built artifacts to both releases
          # Check both target-specific and general bundle directories
          if [[ "${{ matrix.args }}" == *"--target"* ]]; then
            # Extract target from args (e.g., "--target aarch64-apple-darwin" -> "aarch64-apple-darwin")
            TARGET=$(echo "${{ matrix.args }}" | sed 's/.*--target \([^ ]*\).*/\1/')
            BUNDLE_DIR="target/$TARGET/release/bundle"
          else
            BUNDLE_DIR="target/release/bundle"
          fi

          echo "Looking for artifacts in: $BUNDLE_DIR"
          find $BUNDLE_DIR -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.sig" \) 2>/dev/null | while read artifact; do
            filename=$(basename "$artifact")
            echo "Processing artifact: $filename"
            
            # Upload to full release with "-full" suffix
            full_name="${filename%.*}-full.${filename##*.}"
            echo "Uploading $full_name to full release"
            gh release upload $FULL_TAG "$artifact" --repo "Lukem121/voicegecko-releases" --clobber
            
            # Upload to update release with "-update" suffix
            update_name="${filename%.*}-update.${filename##*.}"
            echo "Uploading $update_name to update release"
            gh release upload $UPDATE_TAG "$artifact" --repo "Lukem121/voicegecko-releases" --clobber
          done

  # Revalidate ISR cache after successful release
  revalidate-cache:
    needs: publish-tauri
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Revalidate Website Cache
        run: |
          echo "Triggering ISR revalidation for landing page..."
          curl -X POST "${{ vars.VITE_PUBLIC_VOICEGECKO_URL }}/api/revalidate" \
            -H "Content-Type: application/json" \
            -d '{
              "secret": "${{ secrets.REVALIDATE_SECRET }}",
              "paths": ["/"],
              "tags": ["downloads", "landing-page"]
            }' \
            --fail-with-body \
            --max-time 30 \
            || echo "Revalidation failed - this is non-critical"
