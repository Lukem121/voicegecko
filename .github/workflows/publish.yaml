name: "publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: "macos-latest" # for Arm based macs (M1 and above).
          #   args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest" # for Intel based macs.
          #   args: "--target x86_64-apple-darwin"
          # - platform: "ubuntu-22.04"
          #   args: ""
          # - platform: "windows-latest"
          #   args: ""
          - platform: "self-hosted"
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: apps/desktop

      # Publish to separate public releases repository
      - name: Create Release in Public Repository
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          # Get the version from the package.json
          $VERSION = (Get-Content "apps/desktop/package.json" | ConvertFrom-Json).version
          $TAG_NAME = "app-v$VERSION"

          # Debug: Check if build directories exist
          Write-Host "Checking build directories..."
          $TARGET_DIR = "apps/desktop/src-tauri/target"
          $RELEASE_DIR = "$TARGET_DIR/release"
          $BUNDLE_DIR = "$RELEASE_DIR/bundle"

          Write-Host "Target directory exists: $(Test-Path $TARGET_DIR)"
          Write-Host "Release directory exists: $(Test-Path $RELEASE_DIR)"
          Write-Host "Bundle directory exists: $(Test-Path $BUNDLE_DIR)"

          if (Test-Path $TARGET_DIR) {
            Write-Host "Contents of target directory:"
            Get-ChildItem $TARGET_DIR -Recurse | Select-Object FullName | Format-Table -AutoSize
          }

          # Check if bundle directory exists before proceeding
          if (-not (Test-Path $BUNDLE_DIR)) {
            Write-Error "Bundle directory not found at $BUNDLE_DIR. Tauri build may have failed."
            exit 1
          }

          # Find all built artifacts
          $ARTIFACTS = Get-ChildItem -Path $BUNDLE_DIR -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe', '.sig') }

          if ($ARTIFACTS.Count -eq 0) {
            Write-Error "No artifacts found in $BUNDLE_DIR"
            Write-Host "Contents of bundle directory:"
            Get-ChildItem $BUNDLE_DIR -Recurse | Select-Object FullName | Format-Table -AutoSize
            exit 1
          }

          Write-Host "Found $($ARTIFACTS.Count) artifacts to upload:"
          foreach ($artifact in $ARTIFACTS) {
            Write-Host "  - $($artifact.Name) ($($artifact.Length) bytes)"
          }

          # Create release in public repository
          Write-Host "Creating release $TAG_NAME in voicegecko-releases repository..."
          gh release create $TAG_NAME --repo "Lukem121/voicegecko-releases" --title "App v$VERSION" --notes "See the assets to download this version and install."

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to create release"
            exit 1
          }

          # Upload all built artifacts to the public repository
          foreach ($artifact in $ARTIFACTS) {
            Write-Host "Uploading $($artifact.Name)..."
            gh release upload $TAG_NAME $artifact.FullName --repo "Lukem121/voicegecko-releases"
            
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to upload $($artifact.Name)"
              exit 1
            }
          }

          Write-Host "Successfully created release and uploaded all artifacts!"
