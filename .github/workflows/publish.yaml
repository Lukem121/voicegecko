name: "publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # - platform: "macos-latest" # for Arm based macs (M1 and above).
          #   args: "--target aarch64-apple-darwin"
          # - platform: "macos-latest" # for Intel based macs.
          #   args: "--target x86_64-apple-darwin"
          # - platform: "ubuntu-22.04"
          #   args: ""
          # - platform: "windows-latest"
          #   args: ""
          - platform: "self-hosted"
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install dependencies (windows self-hosted)
        if: matrix.platform == 'self-hosted'
        run: |
          # Check if CMake is installed
          $cmakeInstalled = Get-Command cmake -ErrorAction SilentlyContinue
          if (-not $cmakeInstalled) {
            Write-Host "Installing CMake..."
            # Download and install CMake
            $cmakeUrl = "https://github.com/Kitware/CMake/releases/download/v3.28.1/cmake-3.28.1-windows-x86_64.msi"
            $cmakeInstaller = "$env:TEMP\cmake-installer.msi"
            Invoke-WebRequest -Uri $cmakeUrl -OutFile $cmakeInstaller
            Start-Process msiexec.exe -ArgumentList "/i", $cmakeInstaller, "/quiet", "/norestart" -Wait
            # Add CMake to PATH for current session
            $env:Path = "C:\Program Files\CMake\bin;$env:Path"
          } else {
            Write-Host "CMake is already installed"
          }

          # Check if Vulkan SDK is installed
          if (-not (Test-Path "C:\VulkanSDK")) {
            Write-Host "Installing Vulkan SDK..."
            # Download and install Vulkan SDK
            $vulkanUrl = "https://sdk.lunarg.com/sdk/download/1.4.321.1/windows/VulkanSDK-1.4.321.1-Installer.exe"
            $vulkanInstaller = "$env:TEMP\VulkanSDK-Installer.exe"
            Invoke-WebRequest -Uri $vulkanUrl -OutFile $vulkanInstaller
            Start-Process -FilePath $vulkanInstaller -ArgumentList "/S" -Wait
            # Set VULKAN_SDK environment variable for current session
            $env:VULKAN_SDK = "C:\VulkanSDK\1.4.321.1"
            $env:Path = "$env:VULKAN_SDK\Bin;$env:Path"
          } else {
            Write-Host "Vulkan SDK is already installed"
            # Find the installed version and set environment variable
            $vulkanVersion = Get-ChildItem "C:\VulkanSDK" | Select-Object -First 1 -ExpandProperty Name
            $env:VULKAN_SDK = "C:\VulkanSDK\$vulkanVersion"
          }

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VULKAN_SDK: ${{ matrix.platform == 'self-hosted' && 'C:\VulkanSDK\1.4.321.1' || '' }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: apps/desktop

      # Publish to separate public releases repository
      - name: Create Release in Public Repository
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          # Get the version from the package.json
          $VERSION = (Get-Content "apps/desktop/package.json" | ConvertFrom-Json).version
          $TAG_NAME = "app-v$VERSION"

          # Create release in public repository
          $RELEASE_RESPONSE = gh release create $TAG_NAME --repo "Lukem121/voicegecko-releases" --title "App v$VERSION" --notes "See the assets to download this version and install."

          # Upload all built artifacts to the public repository
          $ARTIFACTS = Get-ChildItem -Path "target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in @('.msi', '.exe', '.sig') }

          foreach ($artifact in $ARTIFACTS) {
            gh release upload $TAG_NAME $artifact.FullName --repo "Lukem121/voicegecko-releases"
          }
