name: Bug report
description: Something is broken or behaving unexpectedly
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Voice Gecko. Please search existing issues first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop app
        - Web app
        - Dictation / transcription
        - Auth / account
        - Billing / Support plan
        - Docs / repo
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / OS version
      description: e.g. Desktop 1.2.3 on Windows 11, or browser + OS
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs, or related issues
    validations:
      required: false
